name: sync

# Бот читает опт и правит посты в трёх каналах: MUNIS_PRICE, IStore ima и Price.
# Своего сервера не нужно: прогон занимает от десяти секунд, когда ничего
# не изменилось, до трёх минут, когда поменялся весь каталог.
on:
  schedule:
    # Планировщик GitHub пропускает большую часть слотов у приватных
    # репозиториев: из 19 часовых прогонов фактически прошло 6. Чаще
    # объявленные слоты не увеличивают расход минут (пропущенные не
    # тарифицируются), но сокращают фактический интервал.
    - cron: "7,37 * * * *"
  workflow_dispatch:

# Два одновременных прогона перезаписали бы state.json друг другу.
concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install --quiet -r requirements.txt

      # Канал Price ведёт тот же бот, что и MUNIS, поэтому токен общий.
      # Посты — таблицами Rich Messages (message_format: rich в конфиге).
      # Идёт первым: клиент просил получать цены не позже MUNIS. Каналы
      # обновляются по очереди, по ~3,5 минуты на канал.
      - name: Синхронизация Price
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python main.py --once --config config-price.yaml --state state-price.json

      - name: Синхронизация MUNIS_PRICE
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python main.py --once

      # Канал ima на том же коде: свой конфиг, своё состояние, свой бот.
      # Падение одного канала не должно ронять другой, поэтому continue-on-error.
      - name: Синхронизация IStore ima
        continue-on-error: true
        env:
          BOT_TOKEN_IMA: ${{ secrets.BOT_TOKEN_IMA }}
        run: python main.py --once --config config-ima.yaml --state state-ima.json

      - name: Выгрузка прайсов в артефакты
        uses: actions/upload-artifact@v7
        with:
          name: price-xlsx
          path: |
            _excel/*.xlsx
            _excel_ima/*.xlsx
            _excel_price/*.xlsx
          if-no-files-found: warn
          retention-days: 14

      # state.json — единственная память бота о том, какие сообщения он ведёт.
      # Без коммита обратно следующий прогон опубликовал бы каталог заново.
      - name: Сохранение state.json
        run: |
          # state-price.json до первого прогона не существует: git diff его не видит,
          # поэтому новые файлы проверяем через status.
          if [ -z "$(git status --porcelain -- state.json state-ima.json state-price.json)" ]; then
            echo "состояние без изменений"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add падает на несуществующем файле, а state нового канала
          # может не появиться, если его шаг упал до первой записи.
          for f in state.json state-ima.json state-price.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "chore: обновление состояния каналов"
          # GitHub временами отвечает на пуш 500 (fatal error in commit_refs).
          # Потерянный state после прогона, создавшего сообщения, означает
          # дубли в канале на следующем прогоне, поэтому пуш повторяем.
          for delay in 10 20 40 80; do
            if git push; then
              exit 0
            fi
            echo "пуш не прошёл, повтор через ${delay} с"
            sleep "$delay"
            git pull --rebase
          done
          git push

      # Если state так и не запушился, он остаётся в артефакте: его можно
      # закоммитить руками до следующего прогона и не получить дублей.
      - name: Состояние в артефакты при сбое
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: state-unsaved
          path: |
            state.json
            state-ima.json
            state-price.json
          retention-days: 7
