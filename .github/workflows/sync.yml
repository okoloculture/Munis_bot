name: sync

# Раз в час бот читает опт, пересчитывает цены и правит посты в канале.
# Своего сервера не нужно: прогон занимает от десяти секунд, когда ничего
# не изменилось, до трёх минут, когда поменялся весь каталог.
on:
  schedule:
    # Планировщик GitHub пропускает большую часть слотов у приватных
    # репозиториев: из 19 часовых прогонов фактически прошло 6. Чаще
    # объявленные слоты не увеличивают расход минут (пропущенные не
    # тарифицируются), но сокращают фактический интервал.
    - cron: "7,37 * * * *"
  workflow_dispatch:

# Два одновременных прогона перезаписали бы state.json друг другу.
concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install --quiet -r requirements.txt

      - name: Синхронизация
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python main.py --once

      - name: Выгрузка прайса в артефакты
        uses: actions/upload-artifact@v7
        with:
          name: price-xlsx
          path: _excel/*.xlsx
          if-no-files-found: warn
          retention-days: 14

      # state.json — единственная память бота о том, какие сообщения он ведёт.
      # Без коммита обратно следующий прогон опубликовал бы каталог заново.
      - name: Сохранение state.json
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json без изменений"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: обновление state.json"
          git push
