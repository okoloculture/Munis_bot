# Канал «Price» на общем движке. Источник и наценка — как у MUNIS_PRICE.
source_channel: opt_uniseil

# Канал ведёт тот же бот, что и MUNIS (@redacher1bot), поэтому токен общий
bot_token_env: BOT_TOKEN

# Канал приватный: username нет, ссылки в навигации будут вида t.me/c/
target_chat_id: "-1004374090427"
target_channel: null

# Вводные посты в самом начале канала — перенесены из прежнего канала клиента
# (t.me/DEVICE_SHOP_PRO/6, 8, 9). Кнопки на них идут в навигации над категориями.
intro_posts:
  - {title: "Welcome 🙌", html: "intro/welcome.html", photo: "intro/welcome.jpg"}
  - {title: "ЗНАКОМСТВО ✨", html: "intro/znakomstvo.html", photo: "intro/znakomstvo.jpg"}
  - {title: "Как оформить заказ 🧐", html: "intro/order.html", photo: "intro/order.jpg"}

# Посты категорий — таблицами Rich Messages (Bot API 10.1+): одна категория,
# один пост, шапка «Категория | Цена». Обычный текст — message_format: text.
message_format: rich

# Названия для покупателя: «iPhone 17e 256GB …» вместо «17e 256GB …»,
# «MacBook Neo Citrus A18 Pro 8/256 (MHFD4)» вместо «MHFD4 Neo … (6/5/8/256)»
tidy_names: true

# Наценка как у MUNIS_PRICE, в рублях
markup_tiers:
  - {up_to: 10000, add: 2000}
  - {up_to: 15000, add: 3000}
  - {up_to: 40000, add: 4000}
  - {up_to: 80000, add: 5000}
  - {up_to: 110000, add: 6000}
  - {up_to: 135000, add: 7000}
  - {up_to: 160000, add: 8000}
  - {up_to: 185000, add: 9000}
  - {up_to: null, add: 13000}

# В rich-формате не используется: цена идёт отдельной колонкой таблицы
price_format: "{name} — {price} ₽"
round_to_nearest: 0

check_interval: 3600
max_scan_pages: 8

categories:
  - Google
  - Honor
  - Huawei
  - OnePlus
  - Realme
  - Xiaomi
  - Samsung Galaxy S
  - Samsung Galaxy A
  - Samsung Galaxy Z
  - Samsung Galaxy Tab
  - Samsung Galaxy Watch
  - Samsung Galaxy Buds
  - AirPods
  - Watch SE \ S10 \ S11 \ S12
  - Ultra Watch
  - iPhone 16e \ 16
  - iPhone 16 Plus
  - iPhone 16 Pro
  - iPhone 16 Pro Max
  - iPhone 17e \ 17
  - iPhone 17 Air
  - iPhone 17 Pro
  - iPhone 17 Pro Max
  - iPhone 18 Pro
  - iPhone 18 Pro Max
  - iPad Air
  - iPad Pro
  - iPad Mini \ 10 \ 11
  - MacBook Neo \ Air
  - MacBook Pro

# Samsung в опте один большой блок, а покупатель ищет по сериям, как у Apple.
# Строка уходит в первую серию, чей шаблон совпал с её началом (без учёта регистра).
split_categories:
  Samsung:
    - {title: "Samsung Galaxy S", pattern: "Galaxy S\\d"}
    - {title: "Samsung Galaxy A", pattern: "Galaxy A\\d"}
    - {title: "Samsung Galaxy Z", pattern: "Galaxy Z"}
    - {title: "Samsung Galaxy Tab", pattern: "Galaxy Tab"}
    - {title: "Samsung Galaxy Watch", pattern: "Galaxy (Watch|Ring)"}
    - {title: "Samsung Galaxy Buds", pattern: "Galaxy Buds"}

# iPhone 15 и старше клиенту не нужны
deny_categories:
  - iPhone (ASIS)
  - iPhone 11 \ 12
  - iPhone 13
  - iPhone 14
  - iPhone 15

allow_create: true
disable_notification: true

nav:
  enabled: true
  text: "🛍️ КАТАЛОГ ТОВАРОВ 🛍️"
  columns: 3
  row_width: 30
  pin: true
  button_style: default

order_button:
  text: "ЗАКАЗАТЬ"
  url: "https://t.me/Art_Dev15"
  style: primary

# Текста от клиента пока нет. Появится — положить в info-price.html и включить.
info_message:
  enabled: false
  file: "info-price.html"

excel:
  enabled: true
  publish: false
  output_dir: "_excel_price"
  filename: "Прайс_Price_{date}.xlsx"
